# This is a Databricks asset bundle definition for Dbasocciate_final_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Dbasocciate_final_project
  uuid: 97427d7e-c00a-4564-9a40-e5a3b8f047f2

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-a2ba0f20-1e00.cloud.databricks.com
    variables:
      catalog: proyecto_final
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-a2ba0f20-1e00.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/williamproduceryt@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/williamproduceryt@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: proyecto_final
      schema: prod
    permissions:
      - user_name: williamproduceryt@gmail.com
        level: CAN_MANAGE
