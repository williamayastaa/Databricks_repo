# Definición del Bundle para ventas_retail_william_barboza
bundle:
  name: ventas_retail_william_barboza
  uuid: 72eed26d-8441-43d0-8b60-df494097af9e

include:
  - resources/*.yml

variables:
  catalog:
    description: El catálogo principal en Unity Catalog
    default: proyecto_final
  schema_bronze:
    description: Esquema para la capa Bronze
    default: bronze
  schema_silver:
    description: Esquema para la capa Silver
    default: silver
  schema_gold:
    description: Esquema para la capa Gold
    default: gold

targets:
