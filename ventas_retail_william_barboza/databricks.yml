    mode: development
    default: true
    workspace:
      host: https://dbc-a2ba0f20-1e00.cloud.databricks.com
    variables:
      catalog: proyecto_final
      schema_bronze: bronze
      schema_silver: silver
      schema_gold: gold

  prod:
    mode: production
    workspace:
      host: https://dbc-a2ba0f20-1e00.cloud.databricks.com
      root_path: /Workspace/Users/williamproduceryt@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: proyecto_final
      schema_bronze: bronze
      schema_silver: silver
      schema_gold: gold
    permissions:
      - user_name: williamproduceryt@gmail.com
        level: CAN_MANAGE