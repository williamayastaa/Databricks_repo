# The main pipeline for ventas_retail_william_barboza

resources:
  pipelines:
    ventas_retail_william_barboza_etl:
      name: ventas_retail_william_barboza_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/ventas_retail_william_barboza_etl"

      libraries:
        - glob:
            include: ../src/ventas_retail_william_barboza_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
